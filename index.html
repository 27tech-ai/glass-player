<!-- ===== HOME: input + 2 icons. Saved playlists appear by themselves when they exist. ===== -->
<main id="homeView" class="home">
  <img class="logo" src="icon.svg" alt="" width="76" height="76">
  <div class="link-bar glass">
    <input id="urlInput" data-focusable type="url" inputmode="url"
           placeholder=".m3u / .m3u8 / EPG…" title="Playlist link — or EPG (XMLTV) link" aria-label="Playlist or EPG link">
    <button id="loadUrlBtn" class="icon-btn primary" data-focusable title="Load this link" aria-label="Load this link"><svg class="ic"><use href="#i-load" xlink:href="#i-load"/></svg></button>
    <label class="icon-btn" data-focusable tabindex="0" id="fileLabel" title="Open a playlist file (.m3u / .m3u8)" aria-label="Open a playlist file">
      <svg class="ic"><use href="#i-file" xlink:href="#i-file"/></svg>
      <input id="fileInput" type="file" accept=".m3u,.m3u8,.xml,audio/x-mpegurl,application/vnd.apple.mpegurl,text/xml" hidden>
    </label>
  </div>
  <div id="savedPanel" class="glass lib" hidden><div id="savedList" class="saved"></div></div>
</main>

<!-- ===== PLAYER: video only. 4 icons, auto-hidden. ===== -->
<main id="playerView" hidden>
  <video id="video" playsinline data-focusable tabindex="0" aria-label="Player"></video>
  <div id="spinner" hidden aria-hidden="true"></div>
  <audio id="extAudio" hidden></audio>

  <nav id="toolbar" class="toolbar glass" aria-label="Controls">
    <button id="homeBtn" class="icon-btn" data-focusable title="Back to link input" aria-label="Back to link input"><svg class="ic"><use href="#i-home" xlink:href="#i-home"/></svg></button>
    <button id="channelsBtn" class="icon-btn" data-focusable title="Channels" aria-label="Channels"><svg class="ic"><use href="#i-list" xlink:href="#i-list"/></svg></button>
    <button id="settingsBtn" class="icon-btn" data-focusable title="Quality · Audio · Subtitles · Dark/Light" aria-label="Settings"><svg class="ic"><use href="#i-settings" xlink:href="#i-settings"/></svg></button>
    <button id="fsBtn" class="icon-btn" data-focusable title="Fullscreen" aria-label="Fullscreen"><svg class="ic"><use href="#i-expand" xlink:href="#i-expand"/></svg></button>
  </nav>

  <div id="nowOverlay" class="now glass">
    <img id="npLogo" alt="" hidden>
    <div><b id="npName"></b><small id="npEpg"></small></div>
  </div>

  <div id="settingsPanel" class="glass pop" hidden>
    <div class="set-row"><select id="quality" data-focusable title="Video quality" aria-label="Video quality"><option value="-1">Quality · Auto</option></select></div>
    <div class="set-row"><select id="audioSel" data-focusable title="Audio track" aria-label="Audio track"><option value="-1">Audio · Auto</option></select></div>
    <div class="set-row"><select id="subSel" data-focusable title="Subtitles" aria-label="Subtitles"><option value="-1">Subtitles · Off</option></select></div>
    <div class="set-row"><input id="extAudioUrl" data-focusable type="url" inputmode="url" placeholder="Audio link…" title="External audio link — merged & synced with the playing channel" aria-label="External audio link">
      <button id="mergeBtn" class="icon-btn" data-focusable title="Merge this audio with the playing channel (sync) — press again to unmerge" aria-label="Merge external audio"><svg class="ic"><use href="#i-link" xlink:href="#i-link"/></svg></button></div>
    <div class="set-row"><button id="themeBtn" class="icon-btn" data-focusable title="Dark / Light mode" aria-label="Dark or Light mode"><svg class="ic"><use href="#i-moon" xlink:href="#i-moon"/></svg></button></div>
  </div>

  <aside id="drawer" class="drawer glass" hidden>
    <div class="drawer-head">
      <input id="search" data-focusable type="search" placeholder="Search…" title="Search channels" aria-label="Search channels">
      <select id="groupFilter" data-focusable title="Group / category" aria-label="Group"><option value="">All</option></select>
      <button id="drawerClose" class="icon-btn" data-focusable title="Close channels" aria-label="Close channels"><svg class="ic"><use href="#i-close" xlink:href="#i-close"/></svg></button>
    </div>
    <div class="tabs">
      <button id="tabAll" class="icon-btn tab active" data-focusable title="All channels" aria-label="All channels"><svg class="ic"><use href="#i-all" xlink:href="#i-all"/></svg></button>
      <button id="tabFav" class="icon-btn tab" data-focusable title="Favorites" aria-label="Favorites"><svg class="ic"><use href="#i-star" xlink:href="#i-star"/></svg></button>
      <button id="tabRecent" class="icon-btn tab" data-focusable title="Recently watched" aria-label="Recently watched"><svg class="ic"><use href="#i-recent" xlink:href="#i-recent"/></svg></button>
    </div>
    <div id="channelList" class="channels" role="listbox" aria-label="Channels"></div>
    <button id="moreBtn" class="icon-btn wide" data-focusable title="Show more channels" aria-label="Show more channels" hidden><svg class="ic"><use href="#i-more" xlink:href="#i-more"/></svg></button>
  </aside>
</main>

<div id="toast" class="toast glass" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
